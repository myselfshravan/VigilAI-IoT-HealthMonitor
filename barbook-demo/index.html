<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BarBook Demo</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0d;color:#f5f5f5}button{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:15px;cursor:pointer}.app{max-width:430px;margin:auto;min-height:100vh;background:#111114}.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#5b1c27,#111114 55%)}.bottle{font-size:90px;filter:drop-shadow(0 15px 25px #000);animation:b 1.5s infinite alternate}@keyframes b{to{transform:translateY(-8px) rotate(2deg)}}.logo{font-size:34px;font-weight:900;letter-spacing:-1px}.sub{color:#aaa;margin:8px 0 35px}.primary{background:#f0c56a;color:#17110a;width:82%}.ghost{background:#242429;color:white;width:100%}.header{padding:22px 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900}.gold{color:#f0c56a}.content{padding:8px 18px 100px}.rolegrid{display:grid;gap:14px;margin-top:25px}.role{background:#1b1b20;padding:24px;text-align:left;border:1px solid #292930}.role b{font-size:20px}.role span{display:block;color:#999;margin-top:7px}.select{width:100%;background:#1b1b20;color:#fff;border:1px solid #333;padding:15px;border-radius:13px;margin:10px 0 18px}.card{background:#1b1b20;border:1px solid #292930;border-radius:18px;padding:17px;margin:12px 0}.title{font-weight:800;font-size:17px;margin-bottom:12px}.big{font-size:29px;font-weight:900}.muted{color:#999}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #292930}.row:last-child{border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#1b1b20;border-radius:16px;padding:15px;border:1px solid #292930}.stat .n{font-size:21px;font-weight:900;margin-top:6px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);background:#17171b;border-top:1px solid #292930;display:flex;justify-content:space-around;padding:10px}.tabs button{background:none;color:#aaa;padding:8px;font-size:12px}.tabs .active{color:#f0c56a}.back{background:none;color:#aaa;padding:0}.pill{display:inline-block;background:#2a2022;color:#f0c56a;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}input{width:100%;background:#111114;border:1px solid #333;color:#fff;padding:13px;border-radius:10px;margin:5px 0 10px}.product{display:grid;grid-template-columns:1.5fr .7fr .7fr;gap:6px;align-items:center;padding:11px 0;border-bottom:1px solid #292930;font-size:13px}</style></head>
<body><div class="app" id="app"></div><script>
const products=[["Royal Oak Whisky 750ml","Whisky",1200,1250],["Blue Crown Vodka 750ml","Vodka",1500,1550],["Golden Barrel Rum 750ml","Rum",1050,1100],["King Lager 650ml","Beer",180,200],["Sunset Wine 750ml","Wine",900,950]];
function splash(){app.innerHTML=`<div class="splash"><div class="bottle">🍾</div><div class="logo">BAR<span class="gold">BOOK</span></div><div class="sub">Smart Bar Management</div><button class="primary" onclick="roles()">OPEN BARBOOK</button></div>`}
function roles(){app.innerHTML=`<div class="content" style="padding-top:55px"><div class="logo">BAR<span class="gold">BOOK</span></div><p class="muted">Choose your workspace</p><div class="rolegrid"><button class="role" onclick="owner()"><b>👑 Owner</b><span>View bars, sales, expenses & reports</span></button><button class="role" onclick="cashier()"><b>🧾 Manager / Cashier</b><span>Enter daily stock, sales & expenses</span></button></div></div>`}
function shell(title,body,tab){app.innerHTML=`<div class="header"><div class="brand">BAR<span class="gold">BOOK</span></div><button class="back" onclick="roles()">Switch</button></div><div class="content"><h2>${title}</h2>${body}</div><div class="tabs"><button class="${tab=='home'?'active':''}" onclick="owner()">Home</button><button class="${tab=='stock'?'active':''}" onclick="cashier()">Stock</button><button class="${tab=='products'?'active':''}" onclick="productsPage()">Products</button><button class="${tab=='reports'?'active':''}" onclick="reports()">Reports</button></div>`}
function owner(){shell("Owner Dashboard",`<label class="muted">SELECT BAR</label><select class="select"><option>Bar 1 — Indiranagar</option><option>Bar 2 — Koramangala</option><option>Bar 3 — Whitefield</option></select><div class="grid"><div class="stat"><span class="muted">Today's Sales</span><div class="n">₹58,420</div></div><div class="stat"><span class="muted">Expenses</span><div class="n">₹9,850</div></div></div><div class="card"><div class="title">Sales Collection</div><div class="row"><span>Cash</span><b>₹18,200</b></div><div class="row"><span>UPI / PhonePe</span><b>₹22,640</b></div><div class="row"><span>Credit Card</span><b>₹11,780</b></div><div class="row"><span>Debit Card</span><b>₹5,800</b></div></div><div class="card"><div class="title">Sales Mix</div><div class="row"><span>Normal Sales</span><b>₹47,920</b></div><div class="row"><span>Retail Sales</span><b>₹10,500</b></div></div><div class="card"><div class="title">Today's Expenses</div><div class="row"><span>Staff</span><b>₹5,000</b></div><div class="row"><span>Electricity</span><b>₹2,350</b></div><div class="row"><span>Miscellaneous</span><b>₹2,500</b></div><button class="ghost" onclick="reports()">View Complete Statement</button></div>`,'home')}
function cashier(){shell("Daily Statement",`<div class="pill">30 SEP 2026 • BAR 1</div><div class="card"><div class="title">Stock Flow</div><div class="row"><span>Yesterday's Closing</span><b>163</b></div><div class="row"><span>Today's New Stock</span><b>58</b></div><div class="row"><span>Total Available</span><b>221</b></div><div class="row"><span>Today's Sales</span><b>93</b></div><div class="row"><span>Closing Stock</span><b class="gold">128</b></div></div><div class="card"><div class="title">Sales Entry</div><label class="muted">Normal Sales</label><input value="78" type="number"><label class="muted">Retail Sales</label><input value="15" type="number"><button class="primary" onclick="alert('Statement saved. Closing stock recalculated automatically.')">SAVE TODAY'S STATEMENT</button></div><div class="card"><div class="title">Payment Collection</div><div class="row"><span>Cash</span><b>₹18,200</b></div><div class="row"><span>UPI</span><b>₹22,640</b></div><div class="row"><span>Cards</span><b>₹17,580</b></div></div>`,'stock')}
function productsPage(){let rows=products.map(p=>`<div class="product"><div><b>${p[0]}</b><br><span class="muted">${p[1]}</span></div><span>₹${p[2]}</span><span>₹${p[3]}</span></div>`).join('');shell("Products & Prices",`<div class="card"><div class="title">Bar 1 Product Catalogue</div><div class="product"><b>Product</b><b>Normal</b><b>Retail</b></div>${rows}<button class="ghost" style="margin-top:14px" onclick="alert('Add new brand / bottle size')">+ Add New Product</button></div><div class="card"><div class="title">Price Change</div><p class="muted">Update normal or retail price. Changes are saved with date and user history.</p><button class="ghost" onclick="alert('Price history opened')">View Price History</button></div>`,'products')}
function reports(){shell("Reports & Statement",`<div class="grid"><div class="stat"><span class="muted">Today</span><div class="n">₹58,420</div></div><div class="stat"><span class="muted">This Month</span><div class="n">₹14.8L</div></div></div><div class="card"><div class="title">Expenses</div><div class="row"><span>Today</span><b>₹9,850</b></div><div class="row"><span>This Week</span><b>₹48,300</b></div><div class="row"><span>This Month</span><b>₹1,84,650</b></div></div><div class="card"><div class="title">Complete Statement</div><p class="muted">Statements available for the last 12 months. Filter by day, week, month or custom date.</p><button class="primary" onclick="alert('12-month statement opened')">OPEN 1-YEAR STATEMENT</button></div>`,'reports')}
splash();
</script></body></html>
